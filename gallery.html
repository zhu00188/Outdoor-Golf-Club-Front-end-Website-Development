<!doctype html>
<html lang="en">

<head>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon.png">

    <link href="assets/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/bootstrap-icons.css">

    <link href="assets/css/all.min.css" rel="stylesheet">

    <link href="assets/css/fontawesome.min.css" rel="stylesheet">

    <link rel="stylesheet" href="assets/css/swiper-bundle.min.css">

    <link rel="stylesheet" href="assets/css/nice-select.css">

    <link rel="stylesheet" href="assets/css/lightbox.min.css">

    <link rel="stylesheet" href="assets/css/magnific-popup.css">

    <link rel="stylesheet" href="assets/css/style.css">

    <title>GolfSpace - Gallery</title>
</head>

<body>

    <div class="preloader_area_wrap">
        <div class="sk-cube-grid">
            <div class="sk-cube sk-cube1"></div>
            <div class="sk-cube sk-cube2"></div>
            <div class="sk-cube sk-cube3"></div>
            <div class="sk-cube sk-cube4"></div>
            <div class="sk-cube sk-cube5"></div>
            <div class="sk-cube sk-cube6"></div>
            <div class="sk-cube sk-cube7"></div>
            <div class="sk-cube sk-cube8"></div>
            <div class="sk-cube sk-cube9"></div>
        </div>
    </div>


    <!-- header will be loaded from partials/header.html -->
    <div id="site-header-placeholder"></div>
    <script>
        (function () {
            var p = document.getElementById('site-header-placeholder');
            if (!p) return;
            fetch('partials/header.html').then(function (r) {
                if (!r.ok) throw new Error('Failed to load header');
                return r.text();
            }).then(function (html) {
                p.outerHTML = html;
            }).catch(function (err) {
                console.error(err);
            });
        })();
    </script>


    <div class="breadcrumb">
        <div class="container">
            <div class="row">
                <div class="col-12">
                    <div class="breadcrumb-wrapper">
                        <div class="breadcrumb-inner">
                            <h1>Gallery</h1>
                            <span><a href="index.html">Home<i class="fas fa-angle-right"></i></a>Gallery</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <main id="main-content">
        <section class="gallery-area sec-mar" aria-labelledby="gallery-heading">
            <div class="container">
                <h2 id="gallery-heading" class="visually-hidden">Photo Gallery</h2>
                <div class="row">
                    <div class="col-12">
                        <div class="gallery-tab">
                            <ul class="tab-menu">
                                <li class="active" data-filter=".fields">Fields & Courses</li>
                                <li data-filter=".lounge">Lounge & Dining</li>
                                <li data-filter=".wellness">Wellness & Recreation</li>
                            </ul>
                        </div>
                    </div>
                </div>
                <div class="row g-2 gallery-grid">
                    <!-- Fields:  -->
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-1.jpg" class="lazy img-fluid"
                                alt="Championship golf course fairway"></div>
                    </div>
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-2.jpg" class="lazy img-fluid"
                                alt="Professional golf course maintenance"></div>
                    </div>
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-3.jpg" class="lazy img-fluid"
                                alt="Beautiful golf course green"></div>
                    </div>
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-4.jpg" class="lazy img-fluid"
                                alt="Golf course landscaping and water features"></div>
                    </div>
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-5.jpg" class="lazy img-fluid"
                                alt="Scenic golf course hole view"></div>
                    </div>
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-6.jpg" class="lazy img-fluid"
                                alt="Championship course tee area"></div>
                    </div>
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-7.jpg" class="lazy img-fluid"
                                alt="Golf driving range practice area"></div>
                    </div>
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-8.jpg" class="lazy img-fluid"
                                alt="Course slope and elevation views"></div>
                    </div>
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-9.jpg" class="lazy img-fluid"
                                alt="Manicured golf course landscaping"></div>
                    </div>
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-10.jpg" class="lazy img-fluid"
                                alt="Golfer on course fairway"></div>
                    </div>
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-11.jpg" class="lazy img-fluid"
                                alt="Premium golf course conditions"></div>
                    </div>
                    <div class="col-md-3 gallery-item fields">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-12.jpg" class="lazy img-fluid"
                                alt="18-hole course layout"></div>
                    </div>

                    <!-- Lounge:  -->
                    <div class="col-md-3 gallery-item lounge">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-18.jpg" class="lazy img-fluid"
                                alt="Elegant member lounge dining"></div>
                    </div>
                    <div class="col-md-3 gallery-item lounge">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-19.jpg" class="lazy img-fluid"
                                alt="Clubhouse dining area"></div>
                    </div>
                    <div class="col-md-3 gallery-item lounge">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-20.jpg" class="lazy img-fluid"
                                alt="Premium lounge seating"></div>
                    </div>
                    <div class="col-md-3 gallery-item lounge">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-13.jpg" class="lazy img-fluid"
                                alt="Modern member lounge interior"></div>
                    </div>
                    <div class="col-md-3 gallery-item lounge">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-14.jpg" class="lazy img-fluid"
                                alt="Social lounge gathering space"></div>
                    </div>
                    <div class="col-md-3 gallery-item lounge">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-15.jpg" class="lazy img-fluid"
                                alt="Restaurant and lounge amenities"></div>
                    </div>
                    <div class="col-md-3 gallery-item lounge">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-16.jpg" class="lazy img-fluid"
                                alt="Private event space lounge"></div>
                    </div>
                    <div class="col-md-3 gallery-item lounge">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-17.jpg" class="lazy img-fluid"
                                alt="Relaxation lounge area"></div>
                    </div>

                    <!-- Wellness: -->
                    <div class="col-md-3 gallery-item wellness">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-21.jpg" class="lazy img-fluid"
                                alt="Fitness center equipment"></div>
                    </div>
                    <div class="col-md-3 gallery-item wellness">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-28.jpg" class="lazy img-fluid"
                                alt="Swimming pool facilities"></div>
                    </div>
                    <div class="col-md-3 gallery-item wellness">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-22.jpg" class="lazy img-fluid"
                                alt="Wellness zone training area"></div>
                    </div>
                    <div class="col-md-3 gallery-item wellness">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-23.jpg" class="lazy img-fluid"
                                alt="Recreation facility amenities"></div>
                    </div>
                    <div class="col-md-3 gallery-item wellness">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-24.jpg" class="lazy img-fluid"
                                alt="Locker room facilities"></div>
                    </div>
                    <div class="col-md-3 gallery-item wellness">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-25.jpg" class="lazy img-fluid"
                                alt="Spa and relaxation center"></div>
                    </div>
                    <div class="col-md-3 gallery-item wellness">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-26.jpg" class="lazy img-fluid"
                                alt="Modern fitness facilities"></div>
                    </div>
                    <div class="col-md-3 gallery-item wellness">
                        <div class="single-gallery"><img src="assets/img/gallery/gallery-27.jpg" class="lazy img-fluid"
                                alt="Wellness center interior"></div>
                    </div>
                </div>
                <div class="load-more">
                    <div class="button--wrap">
                        <a class="eg-btn btn--primary golf-btn mx-auto" href="#">Load More <i
                                class="bi bi-arrow-right"></i></a>
                    </div>
                </div>
            </div>
        </section>


        <section class="newsletter-area" aria-labelledby="newsletter-heading">
            <div class="container-fluid">
                <div class="row">
                    <div class="col-12">
                        <div class="subscribe-newsletter">
                            <span>Stay In Touch</span>
                            <h2 id="newsletter-heading">Newsletter</h2>
                            <form action="#" method="post">
                                <label for="gallery-newsletter-email" class="visually-hidden">Enter Your Email
                                    Here</label>
                                <input type="email" id="gallery-newsletter-email" name="email"
                                    placeholder="Enter Your Email Here">
                                <input type="submit" value="Notify Now">
                            </form>
                            <b>Subscribe</b>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>


    <!-- footer will be loaded from partials/footer.html -->
    <div id="site-footer-placeholder"></div>
    <script>
        (function () {
            var p = document.getElementById('site-footer-placeholder');
            if (!p) return;
            fetch('partials/footer.html').then(function (r) {
                if (!r.ok) throw new Error('Failed to load footer');
                return r.text();
            }).then(function (html) {
                p.outerHTML = html;
            }).catch(function (err) {
                console.error(err);
            });
        })();
    </script>


    <script src="assets/js/jquery-3.6.0.min.js"></script>

    <script src="assets/js/popper.min.js"></script>
    <script src="assets/js/bootstrap.min.js"></script>

    <script src="assets/js/swiper-bundle.min.js"></script>

    <script src="assets/js/jquery.lazy.js"></script>
    <script src="assets/js/jquery.nice-select.min.js"></script>

    <script src="assets/js/anime.min.js"></script>

    <script src="assets/js/waypoints.min.js"></script>

    <script src="assets/js/jquery.counterup.min.js"></script>

    <script src="assets/js/lightbox.min.js"></script>
    <script src="assets/js/lightbox-plus-jquery.min.js"></script>

    <script src="assets/js/jquery.magnific-popup.min.js"></script>

    <script src="assets/js/isotope.pkgd.min.js"></script>

    <script src="assets/js/masonry.pkgd.min.js"></script>

    <script src="assets/js/custom.js"></script>
</body>

</html>
